<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oyguljon | Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:oklch(0.16 0.04 310);--card:oklch(1 0 0 / 6%);--border:oklch(1 0 0 / 12%);
--text:oklch(0.97 0.008 310);--muted:oklch(0.75 0.04 315);
--v:oklch(0.70 0.25 330);--b:oklch(0.68 0.22 290);--c:oklch(0.85 0.16 180);
--grad:linear-gradient(115deg,var(--v),var(--b) 55%,var(--c));}
:root[data-theme="light"]{--bg:oklch(0.98 0.01 320);--card:oklch(1 0 0 / 70%);--border:oklch(0.2 0.04 310 / 12%);
--text:oklch(0.2 0.05 310);--muted:oklch(0.48 0.04 315);
--v:oklch(0.60 0.25 330);--b:oklch(0.58 0.22 290);--c:oklch(0.65 0.15 180);}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;overflow-x:hidden;transition:background .4s,color .4s;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
h1,h2,h3,nav b{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.02em;}
.tag,.tl-item b,.typed,.stat span,time{font-family:'JetBrains Mono',ui-monospace,monospace;}
@keyframes shimmer{0%{background-position:0% 50%;}100%{background-position:200% 50%;}}
.title,.hero h1,nav b,.stat b{background:var(--grad);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite;}
canvas#bg{position:fixed;inset:0;z-index:0;opacity:.55;}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 24px;}
section{padding:90px 0;}
h2.title{font-size:clamp(26px,4vw,40px);margin-bottom:36px;text-align:center;}
p.sub{text-align:center;color:var(--muted);margin-top:-24px;margin-bottom:36px;}
nav{position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);background:color-mix(in oklab,var(--bg) 75%,transparent);
border-bottom:1px solid var(--border);padding:14px 0;}
nav .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
nav .links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;}
nav a{color:var(--muted);text-decoration:none;transition:color .3s;}
nav a:hover{color:var(--v);}
.nav-right{display:flex;align-items:center;gap:10px;}
.langsw{display:flex;border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.langsw button{background:none;border:none;color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace;padding:5px 10px;cursor:pointer;}
.langsw button.active{background:var(--v);color:#fff;}
.themebtn{border:1px solid var(--border);background:var(--card);border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--text);font-size:15px;}
.hero{min-height:88vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;}
.badge{border:1px solid var(--border);border-radius:30px;padding:6px 18px;font-size:13px;color:var(--muted);background:var(--card);box-shadow:0 4px 15px rgba(230,100,200,0.1);}
.hero h1{font-size:clamp(38px,7vw,70px);margin-top:20px;}
.typed{font-size:clamp(16px,2.2vw,20px);color:var(--muted);margin-top:14px;min-height:28px;}
.cursor{border-right:2px solid var(--v);animation:blink .8s infinite;}
@keyframes blink{50%{border-color:transparent;}}
.stats{display:flex;gap:40px;margin-top:44px;flex-wrap:wrap;justify-content:center;}
.stat b{font-size:clamp(26px,4vw,36px);display:block;}
.stat span{color:var(--c);font-size:12px;text-shadow:0 0 8px color-mix(in oklab,var(--c) 60%,transparent);
animation:statglow 2.4s ease-in-out infinite;}
@keyframes statglow{0%,100%{opacity:.65;}50%{opacity:1;text-shadow:0 0 14px color-mix(in oklab,var(--c) 80%,transparent);}}
.reveal{opacity:0;transform:translateY(36px);transition:all .7s cubic-bezier(.2,.7,.3,1);}
.reveal.show{opacity:1;transform:translateY(0);}
.rocket{position:fixed;font-size:26px;left:10%;top:50%;z-index:50;pointer-events:none;
transform:translate(-50%,-50%);will-change:left,top;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;position:relative;z-index:1;}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;backdrop-filter:blur(10px);
transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease,border-color .35s ease;}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:var(--v);
box-shadow:0 0 0 1px color-mix(in oklab,var(--v) 35%,transparent),0 18px 60px -20px color-mix(in oklab,var(--v) 55%,transparent);}
.card .emoji{font-size:30px;}
.card h3{margin:10px 0 6px;font-size:17px;}
.card p{color:var(--muted);font-size:13px;margin-bottom:10px;}
.tl{position:relative;padding-left:28px;border-left:2px solid var(--border);max-width:700px;margin:0 auto;}
.tl-item{margin-bottom:30px;position:relative;}
.tl-item::before{content:'';position:absolute;left:-36px;top:2px;width:13px;height:13px;border-radius:50%;background:var(--grad);}
.tl-item b{color:var(--c);font-size:13px;}
.tl-item h3{margin:4px 0;font-size:16px;}
.tl-item p{color:var(--muted);font-size:14px;}
.skill{margin-bottom:16px;}
.skill .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
.bar{height:8px;border-radius:6px;background:var(--border);overflow:hidden;}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:var(--grad);transition:width 1.3s ease;}
.skillgrid{display:grid;gap:14px;max-width:700px;margin:0 auto;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.about-grid{display:grid;gap:20px;grid-template-columns:3fr 2fr;}
@media(max-width:700px){.about-grid{grid-template-columns:1fr;}}
.about-grid .card p{color:var(--text);font-size:15px;line-height:1.6;}
.about-grid ul{list-style:none;margin-top:10px;}
.about-grid li{color:var(--muted);font-size:13px;margin-bottom:8px;padding-left:16px;position:relative;}
.about-grid li::before{content:'🌸';position:absolute;left:0;font-size:10px;}
.future{position:relative;}
.future .badge2{position:absolute;top:14px;right:14px;font-size:11px;border:1px solid var(--v);color:var(--v);border-radius:20px;padding:2px 8px;}

/* CONTACT SECTION - NAFIS QIZLAR USLUBIDA */
#contact{
  position:relative;
  text-align:center;
  overflow:hidden;
  padding:100px 0;
}
.contact-card {
  position: relative;
  z-index: 2;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 44px 24px;
  backdrop-filter: blur(14px);
  max-width: 800px;
  margin: 0 auto;
  box-shadow: 0 20px 50px rgba(180, 50, 150, 0.15);
  animation: floatCard 4.5s ease-in-out infinite;
}
@keyframes floatCard {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
.contact-avatar {
  width: 95px;
  height: 95px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 20px;
  border: 2px solid var(--v);
  box-shadow: 0 0 25px color-mix(in oklab, var(--v) 60%, transparent);
  animation: avatarPulse 3s ease-in-out infinite;
}
@keyframes avatarPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 20px color-mix(in oklab, var(--v) 50%, transparent); }
  50% { transform: scale(1.06); box-shadow: 0 0 35px color-mix(in oklab, var(--c) 70%, transparent); }
}
svg.net{position:absolute;inset:0;width:100%;height:100%;opacity:.3;z-index:0;}
.net circle{animation:pulse 3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}
.cbtns{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:28px;position:relative;z-index:1;}
.cbtn{
  padding:12px 30px;
  border-radius:30px;
  border:1px solid var(--border);
  color:var(--text);
  text-decoration:none;
  background:var(--card);
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .3s ease;
  animation: floatBtn 3s ease-in-out infinite alternate;
}
.cbtn:nth-child(2) { animation-delay: 1.5s; }
@keyframes floatBtn {
  0% { transform: translateY(0); }
  100% { transform: translateY(-6px); }
}
.cbtn:hover{
  box-shadow:0 0 25px color-mix(in oklab,var(--v) 70%,transparent);
  border-color:var(--v);
  transform: translateY(-8px) scale(1.05) !important;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:26px 0;position:relative;z-index:1;}
</style>
</head>

(function(){

})();
